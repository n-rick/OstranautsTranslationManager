[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ostranauts-translation-manager"
version = "1.2.0"
description = "Gestionnaire de traduction pour Ostranauts"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Votre Nom", email = "votre.email@example.com" }
]
dependencies = [
    "python-dotenv>=1.0.0",
    "googletrans==4.0.0-rc1",
    "requests>=2.31.0",
    "tqdm>=4.70.0",
]

[project.scripts]
ostranauts-translation-manager = "src.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --tb=short"
